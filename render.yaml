services:
  - type: web
    name: haq-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        value: "https://haq-api-u3pz.onrender.com/v1/gmail/callback"
      - key: FRONTEND_ORIGINS
        value: "http://localhost:5173,https://shivansmh.github.io"
      - key: FRONTEND_URL
        value: "https://shivansmh.github.io/haq"
      - key: COOKIE_SECURE
        value: "true"
      - key: LLM_ENABLED
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_SPEND_CAP_USD
        value: "0"
      - key: LLM_MODEL_TRIAGE
        value: "openai/gpt-oss-20b"
      - key: LLM_MODEL_EXTRACT
        value: "openai/gpt-oss-20b"
      - key: LLM_MODEL_RECHECK
        value: "openai/gpt-oss-20b"
      - key: LLM_MAX_MESSAGES_PER_SWEEP
        value: "100"
      - key: SWEEP_MAX_LISTED
        value: "5000"
      - key: SWEEP_JOB_TTL_SECONDS
        value: "3600"
      - key: SWEEP_AUDIT_SAMPLE_RATE
        value: "0.02"
